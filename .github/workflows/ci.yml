name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm audit --prod --audit-level high
      - name: Verify workspace versions and current release metadata
        run: pnpm release:verify

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moduqr_test
          POSTGRES_USER: moduqr
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moduqr -d moduqr_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client utilities
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Build the API
        run: pnpm --filter @moduqr/api build
      - name: Test migrations and database-backed readiness
        run: pnpm --filter @moduqr/api test:integration
        env:
          DATABASE_URL: postgresql://moduqr:integration-only-password@127.0.0.1:5432/moduqr_test
      - name: Build the production API container
        run: docker build --file apps/api/Dockerfile --tag moduqr-api:ci .
      - name: Smoke-test the runtime module loader
        run: docker run --rm --entrypoint node moduqr-api:ci -e "import('file:///app/dist/server.js').then(() => console.log('api-module-load-ok'))"
      - name: Validate the optional API Compose configuration
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=ci-local-only-password' > .env.api
          docker compose --env-file .env.api -f compose.api.yaml config --quiet

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moduqr/web build
      - run: pnpm --filter @moduqr/web test:e2e
        env:
          CI: 'true'
      - name: Reject retry-flaky or unexpected browser tests
        run: pnpm check:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
