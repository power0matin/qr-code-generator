name: Bug report
description: Report a reproducible defect in ModuQR.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Choose…\n3. Export…"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: dropdown
    id: privacy
    attributes:
      label: Does the report contain a real WiFi password, private contact data, or other secrets?
      options: ["No", "Yes — I will remove/redact it before submitting"]
    validations:
      required: true
